<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} – {% endif %}{{ site.title | default: "EklipZ" }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/reading-space.css' | relative_url }}">
  <!-- obsidian-github-pages-publisher:v1 -->
  <link rel="stylesheet" href="{{ '/assets/css/obsidian-publisher.css' | relative_url }}">
  <script>
    window.MathJax = {
      tex: { inlineMath: [['$', '$'], ['\\(', '\\)']], displayMath: [['$$', '$$'], ['\\[', '\\]']], processEscapes: true, processEnvironments: true },
      svg: { fontCache: 'global' }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <script defer src="{{ '/assets/js/obsidian-publisher-render.js' | relative_url }}"></script>
  <!-- /obsidian-github-pages-publisher:v1 -->
</head>
<body{% if page.url contains '/softreg-materials/' %} class="showcase-page"{% endif %}>
  <header class="reading-header">
    <a class="reading-brand" href="{{ '/' | relative_url }}"><span>✳</span> EklipZ<span>.</span></a>
    <nav aria-label="主导航">
      <a href="{{ '/' | relative_url }}">首页</a>
      <a href="{{ '/lun-wen-bi-ji/' | relative_url }}">论文笔记</a>
      <a href="{{ '/dai-ma-bi-ji/' | relative_url }}">代码笔记</a>
      <a href="{{ '/zuo-pin-zhan-shi/' | relative_url }}">作品</a>
      <a href="https://github.com/EklipZZZ">GitHub ↗</a>
    </nav>
  </header>
  <main class="reading-shell">
    <article class="reading-paper page-content">
      {{ content }}
    </article>
  </main>
  <footer class="reading-footer">© {{ site.time | date: "%Y" }} EklipZ <span>·</span> Notes &amp; explorations</footer>
</body>
</html>
