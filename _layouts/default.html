<!DOCTYPE html>
<html lang="{{ site.lang | default: 'zh-CN' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% if page.title %}{{ page.title }} – {% endif %}{{ site.title | default: "我的主页" }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  </head>
  <body style="
    margin: 0 !important;
    padding: 0 !important;
    padding-top: 80px !important;
    background: #f0edf5 !important;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
  ">

    <header style="
      position: fixed !important;
      top: 0 !important;
      left: 0 !important;
      right: auto !important;
      width: 100vw !important;
      max-width: 100% !important;
      float: none !important;
      margin: 0 !important;
      padding: 16px 40px !important;
      background: #1a1a2e !important;
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      box-sizing: border-box !important;
      flex-wrap: wrap !important;
      gap: 10px !important;
      z-index: 99999 !important;
    ">
      <div class="site-title" style="margin: 0 !important; padding: 0 !important;">
        <a href="{{ '/' | relative_url }}" style="font-size: 1.6em !important; font-weight: 700 !important; text-decoration: none !important; color: #ffffff !important; line-height: 1.2 !important;">
          {{ site.title | default: "我的主页" }}
        </a>
      </div>
      <div style="display: flex !important; gap: 24px !important; align-items: center !important; margin: 0 !important; padding: 0 !important;">
        <a href="{{ '/' | relative_url }}" style="text-decoration: none !important; color: #c8b8ff !important; font-weight: 500 !important; line-height: 1.5 !important;">首页</a>
        <a href="{{ '/lun-wen-bi-ji/' | relative_url }}" style="text-decoration: none !important; color: #c8b8ff !important; font-weight: 500 !important; line-height: 1.5 !important;">论文笔记</a>
        <a href="https://github.com/{{ site.github.owner_name | default: 'EklipZ' }}" style="text-decoration: none !important; color: #c8b8ff !important; font-weight: 500 !important; line-height: 1.5 !important;">GitHub</a>
      </div>
    </header>

    <div style="
      max-width: 1200px !important;
      margin: 0 auto !important;
      padding: 20px 30px !important;
      box-sizing: border-box !important;
    ">
      {{ content }}
    </div>

    <footer style="
      text-align: center !important;
      padding: 20px 0 !important;
      color: #888 !important;
      font-size: 0.9em !important;
      border-top: 1px solid #ddd !important;
      margin: 30px auto 0 !important;
      max-width: 1200px !important;
    ">
      &copy; {{ site.time | date: "%Y" }} {{ site.author | default: "EklipZ" }}
    </footer>
  </body>
</html>
